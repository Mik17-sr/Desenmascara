e="opacity:0;animation:k14 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k15 14.0s linear infinite"><text x="635.0" y="344" class="m" text-anchor="middle"><tspan class="b" style="fill:var(--low)">SÍ, ES REAL</tspan><tspan class="m"> · pídele el código 4 8 1 7</tspan></text></g><path d="M176 396 H782" class="edge call" marker-end="url(#ar-edge)" style="animation:k16 14.0s linear infinite"/><g style="opacity:0;animation:k17 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k18 14.0s linear infinite"><text x="325" y="386" class="m" text-anchor="middle"><tspan class="m">«Su código es 4817»</tspan></text></g><g style="animation:k19 14.0s linear infinite"><rect x="655.0" y="420" width="270" height="30" rx="8" class="low-s"/><text x="790" y="440" class="m b" text-anchor="middle" style="fill:var(--low)">Coincide: es BancoAndino de verdad</text></g><circle cx="49" cy="491" r="8" class="badge"/><text x="49" y="495" class="badge-n" text-anchor="middle">i</text><text x="64" y="495" class="s">Si el banco no registró ninguna llamada a tu número: «NO ES TU BANCO». Cuelga y llama tú a la línea de tu tarjeta.</text></svg>
