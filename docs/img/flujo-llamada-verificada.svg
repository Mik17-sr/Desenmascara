<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="titulo"><title id="titulo">Llamada Verificada: BancoAndino registra la llamada y recibe un código de 4 dígitos que vence en 15 minutos. Cuando el asesor te llama, preguntas al bot si es real; el bot te muestra el código y lo compruebas con quien te llama.</title><style>
svg{--card:#f4f6f5;--box:#ffffff;--ink:#131a18;--muted:#5f6b68;--line:#d5dedb;--edge:#97a9a5;
