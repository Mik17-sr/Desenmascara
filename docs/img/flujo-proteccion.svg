--edge:#55706a;--brand:#2bb5a3;--brand-ink:#3cc9b6;--brand-soft:#12312c;--bubble:#1a2422;
--low:#3fb071;--mid:#e0b33a;--high:#e5544a;--low-soft:#143222;--mid-soft:#322a14;--high-soft:#351a19}}
