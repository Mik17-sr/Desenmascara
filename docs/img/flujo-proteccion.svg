0" height="72" rx="12" class="act" style="opacity:0;animation:k1 12.0s linear infinite"/><g style="animation:k2 12.0s linear infinite"><rect x="60" y="136" width="390" height="72" rx="12" class="done"/><circle cx="430" cy="156" r="8" class="chk"/><path d="M426.4 156.2 L429 158.8 L433.8 153.4" class="chk-p"/></g><circle cx="84" cy="162" r="12" class="badge"/><text x="84" y="166.5" class="badge-n" text-anchor="middle">1</text><text x="104" y="167" class="tb">Envías la oferta</text><text x="80" y="192" class="s">La captura, el número del vendedor y la llave de pago</text><rect x="60" y="220" width="390" height="72" rx="12" class="box"/><rect x="60" y="220" width="390" height="72" rx="12" class="act" style="opacity:0;animation:k3 12.0s linear infinite"/><g style="animation:k4 12.0s linear infinite"><rect x="60" y="220" width="390" height="72" rx="12" class="done"/><circle cx="430" cy="240" r="8" class="chk"/><path d="M426.4 240.2 L429 242.8 L433.8 237.4" class="chk-p"/></g><circle cx="84" cy="246" r="12" class="badge"/><text x="84" y="250.5" class="badge-n" text-anchor="middle">2</text><text x="104" y="251" class="tb">Revisa las señales</text><g style="animation:k5 12.0s linear infinite"><rect x="80.0" y="258" width="101.2" height="22" rx="11" class="high-s"/><text x="130.6" y="273" class="xs b" text-anchor="middle" style="fill:var(--high)">Precio irreal</text></g><g style="animation:k6 12.0s linear infinite"><rect x="189.2" y="258" width="69.2" height="22" rx="11" class="high-s"/><text x="223.8" y="273" class="xs b" text-anchor="middle" style="fill:var(--high)">Anticipo</text></g><g style="animation:k7 12.0s linear infinite"><rect x="266.4" y="258" width="120.4" height="22" rx="11" class="high-s"/><text x="326.6" y="273" class="xs b" text-anchor="middle" style="fill:var(--high)">Pasar a otra app</text></g><rect x="60" y="304" width="390" height="72" rx="12" class="box"/><rect x="60" y="304" width="390" height="72" rx="12" class="act" style="opacity:0;animation:k8 12.0s linear infinite"/><g style="animation:k9 12.0s linear infinite"><rect x="60" y="304" width="390" height="72" rx="12" class="done"/><circle cx="430" cy="324" r="8" class="chk"/><path d="M426.4 324.2 L429 326.8 L433.8 321.4" class="chk-p"/></g><circle cx="84" cy="330" r="12" class="badge"/><text x="84" y="334.5" class="badge-n" text-anchor="middle">3</text><text x="104" y="335" class="tb">Te dice cómo pagar seguro</text><text x="80" y="360" class="s">Contraentrega o una plataforma con protección al comprador</text><g style="animation:k10 12.0s linear infinite"><rect x="60" y="390" width="390" height="62" rx="10" class="mid-s"/><text x="78" y="415" class="m"><tspan class="b" style="fill:var(--mid)">SOSPECHOSO</tspan><tspan class="m"> · pide un anticipo a un desconocido</tspan></text><text x="78" y="436" class="m">No pagues hasta tener el producto en la mano.</text></g><rect x="490" y="92" width="430" height="378" rx="14" class="frame"/><text x="510" y="120" class="t">App de Android</text><rect x="520" y="138" width="150" height="296" rx="22" style="fill:#0b100f"/><rect x="528" y="146" width="134" height="280" rx="16" style="fill:#1b2524"/><circle cx="595.0" cy="234" r="24" style="fill:none;stroke:var(--brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:k11 12.0s linear infinite"/><circle cx="595.0" cy="234" r="24" style="fill:none;stroke:var(--brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:k12 12.0s linear infinite"/><circle cx="595.0" cy="234" r="24" style="fill:none;stroke:var(--brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:k13 12.0s linear infinite"/><circle cx="595.0" cy="234" r="24" style="fill:none;stroke:var(--brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:k14 12.0s linear infinite"/><circle cx="595.0" cy="234" r="24" style="fill:#2a3634"/><text x="595.0" y="240" class="t" text-anchor="middle" style="fill:#ffffff">?</text><text x="595.0" y="288" class="tb" text-anchor="middle" style="fill:#ffffff">+57 3•• ••• ••••</text><text x="595.0" y="308" class="xs" text-anchor="middle" style="fill:#94a3a0">Llamada entrante</text><circle cx="562" cy="390" r="16" style="fill:#c0392b"/><circle cx="628" cy="390" r="16" style="fill:#1e8449"/><circle cx="562" cy="390" r="16" class="ring" style="transform-box:fill-box;transform-origin:center;animation:k15 12.0s linear infinite"/><g style="animation:k16 12.0s linear infinite"><rect x="534" y="154" width="122" height="56" rx="10" class="high"/><text x="595.0" y="178" class="tb" text-anchor="middle" style="fill:#ffffff">NO CONTESTES</text><text x="595.0" y="196" class="xs" text-anchor="middle" style="fill:#ffe4e1">número reportado</text></g><g style="animation:k17 12.0s linear infinite"><text x="595.0" y="458" class="m b" text-anchor="middle" style="fill:var(--low)">Rosa no contesta</text></g><rect x="712" y="196" width="188" height="76" rx="12" class="box"/><rect x="712" y="196" width="188" height="76" rx="12" class="act" style="opacity:0;animation:k18 12.0s linear infinite"/><g style="animation:k19 12.0s linear infinite"><rect x="712" y="196" width="188" height="76" rx="12" class="done"/><circle cx="880" cy="216" r="8" class="chk"/><path d="M876.4 216.2 L879 218.8 L883.8 213.4" class="chk-p"/></g><text x="730" y="227" class="tb">Banco de números</text><text x="730" y="250" class="s">3 reportes · falso asesor</text><path d="M674 226 H706" class="edge" marker-end="url(#ar-edge)"/><path d="M708 246 H678" class="edge reply" marker-end="url(#ar-edge)"/><g style="opacity:0;animation:k20 12.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><text x="712" y="306" class="s">Mientras suena, la app consulta</text><text x="712" y="324" class="s">el Banco de números y avisa</text><text x="712" y="342" class="s">antes de contestar.</text><circle cx="49" cy="491" r="8" class="badge"/><text x="49" y="495" class="badge-n" text-anchor="middle">i</text><text x="64" y="495" class="s">Si la entidad registró la llamada, la app dice «Contesta y pide el código».</text></svg>
