<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="titulo"><title id="titulo">Antes de pagar: envías la oferta, el bot revisa señales como el precio irreal o el anticipo y te dice cómo pagar seguro. En Android, cuando entra una llamada, la app consulta el Banco de números y avisa «No contestes» si el número fue reportado.</title><style>
svg{--card:#f4f6f5;--box:#ffffff;--ink:#131a18;--muted:#5f6b68;--line:#d5dedb;--edge:#97a9a5;
