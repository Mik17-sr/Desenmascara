@keyframes k19{0.000%{opacity:0;transform:translateY(4px)}64.286%{opacity:0;transform:translateY(4px)}66.429%{opacity:1;transform:translateY(0)}90.000%{opacity:1;transform:translateY(0)}92.857%{opacity:0;transform:translateY(0)}100.000%{opacity:0;transform:translateY(4px)}}</style><defs><marker id="ar-low" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--low)"/></marker><marker id="ar-mid" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--mid)"/></marker><marker id="ar-high" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--high)"/></marker><marker id="ar-brand" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--brand)"/></marker><marker id="ar-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--edge)"/></marker></defs><rect width="960" height="520" rx="18" class="card"/><text x="40" y="46" class="h1">Círculo de Confianza: ¿de verdad es tu familiar?</text><text x="40" y="70" class="sub">Tu familiar entra al Círculo con una invitación. Si alguien dice ser él y pide plata, Desenmascara le pregunta.</text><line x1="120" y1="146" x2="120" y2="466" class="life"/><rect x="25.0" y="96" width="190" height="50" rx="10" class="box"/><text x="120" y="118" class="tb" text-anchor="middle">Estafador</text><text x="120" y="136" class="xs" text-anchor="middle">número desconocido</text><line x1="360" y1="146" x2="360" y2="466" class="life"/><rect x="265.0" y="96" width="190" height="50" rx="10" class="box"/><text x="360" y="118" class="tb" text-anchor="middle">Tú</text><text x="360" y="136" class="xs" text-anchor="middle">en Telegram</text><line x1="600" y1="146" x2="600" y2="466" class="life"/><rect x="505.0" y="96" width="190" height="50" rx="10" class="box"/><text x="600" y="118" class="tb" text-anchor="middle">Desenmascara</text><text x="600" y="136" class="xs" text-anchor="middle">bot</text><line x1="840" y1="146" x2="840" y2="466" class="life"/><rect x="745.0" y="96" width="190" height="50" rx="10" class="box"/><text x="840" y="118" class="tb" text-anchor="middle">Tu familiar</text><text x="840" y="136" class="xs" text-anchor="middle">en tu Círculo</text><path d="M126 186 H352" class="edge" marker-end="url(#ar-edge)" style="animation:k1 14.0s linear infinite"/><g style="opacity:0;animation:k2 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k3 14.0s linear infinite"><text x="240.0" y="176" class="m" text-anchor="middle"><tspan class="m">«Mami, préstame plata, es urgente»</tspan></text></g><path d="M366 228 H592" class="edge" marker-end="url(#ar-edge)" style="animation:k4 14.0s linear infinite"/><g style="opacity:0;animation:k5 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k6 14.0s linear infinite"><text x="480.0" y="218" class="m" text-anchor="middle"><tspan class="m">Reenvías el mensaje</tspan></text></g><path d="M594 270 H368" class="edge" marker-end="url(#ar-mid)" style="stroke:var(--mid);animation:k7 14.0s linear infinite"/><g style="opacity:0;animation:k8 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k9 14.0s linear infinite"><text x="480.0" y="260" class="m" text-anchor="middle"><tspan class="b" style="fill:var(--mid)">SOSPECHOSO</tspan><tspan class="m"> · no transfieras aún</tspan></text></g><path d="M606 312 H832" class="edge" marker-end="url(#ar-edge)" style="animation:k10 14.0s linear infinite"/><g style="opacity:0;animation:k11 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k12 14.0s linear infinite"><text x="720.0" y="302" class="m" text-anchor="middle"><tspan class="m">«¿Fuiste tú?» · Sí / No</tspan></text></g><path d="M834 354 H608" class="edge reply" marker-end="url(#ar-edge)" style="animation:k13 14.0s linear infinite"/><g style="opacity:0;animation:k14 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k15 14.0s linear infinite"><text x="720.0" y="344" class="m" text-anchor="middle"><tspan class="m">«No fui yo»</tspan></text></g><path d="M594 396 H368" class="edge" marker-end="url(#ar-high)" style="stroke:var(--high);animation:k16 14.0s linear infinite"/><g style="opacity:0;animation:k17 14.0s linear infinite"><circle r="10" class="halo"/><circle r="5" class="pkt"/></g><g style="animation:k18 14.0s linear infinite"><text x="480.0" y="386" class="m" text-anchor="middle"><tspan class="b" style="fill:var(--high)">ES UNA ESTAFA</tspan><tspan class="m"> · no transfieras</tspan></text></g><g style="animation:k19 14.0s linear infinite"><rect x="575.0" y="420" width="290" height="30" rx="8" class="high-s"/><text x="720" y="440" class="m b" text-anchor="middle" style="fill:var(--high)">Y avisa al resto de tu Círculo</text></g><circle cx="49" cy="491" r="8" class="badge"/><text x="49" y="495" class="badge-n" text-anchor="middle">i</text><text x="64" y="495" class="s">Si tu familiar no responde en 5 minutos: «NO PUDIMOS CONFIRMARLO». No transfieras y llámalo a su número de siempre.</text></svg>
